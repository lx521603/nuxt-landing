seo:
  title: 新手村的老李 | 记录生活的美好与趣味
  description: 新手村的老李的个人主页，收集生活中一切值得驻足的美好与趣味。
title: 新手村的老李
description: 收集生活中一切值得驻足的美好与趣味。

hero:
  headline: "👋 你好，我是老李"
  links:
    - label: 最新动态
      color: primary
      size: xl
      to: 'https://sai.st'
    - label: 我的博客
      size: xl
      color: neutral
      variant: soft
      to: 'https://sai.st/blog' 

terminal:
  lines:
    - segments:
        - text: "$ "
          style: prompt
        - text: "laoli"
          style: cmd
        - text: " --mode"
          style: flag
        - text: " life"
          style: string
    - segments:
        - text: "→ Loading life modules..."
          style: dim
    - segments:
        - text: "→ Found "
          style: dim
        - text: "∞ curiosity"
          style: cmd
        - text: ", "
          style: dim
        - text: "100% enthusiasm"
          style: success
    - segments:
        - text: "→ Status: "
          style: dim
        - text: "Exploring the world & collecting beautiful moments"
          style: url
    - segments:
        - text: " "
          style: dim
    - segments:
        - text: "✓ Ready to share."
          style: success

logos:
  title: 老李的「数字行囊」与灵感来源
  items:
    - i-lucide-camera      # 摄影/记录
    - i-lucide-coffee      # 咖啡/日常
    - i-lucide-book-open   # 阅读/学习
    - i-lucide-code        # 折腾代码
    - i-lucide-plane       # 旅行/探索

features:
  headline: 探索领域
  title: "生活的三个切面"
  description: 不做宏大叙事，只记录真实发生的微小感动与有趣发现。
  items:
    - icon: i-lucide-map
      title: 旅途见闻
      description: 从街头巷尾到山川湖海，用镜头和文字定格那些值得被反复回味的风景。
    - icon: i-lucide-coffee
      title: 日常拾趣
      description: 一杯咖啡的香气、一本好书的感悟、一次不期而遇的对话——生活的美，藏在细节里。
    - icon: i-lucide-lightbulb
      title: 奇思妙想
      description: 那些突然冒出的灵感、好玩的工具、有趣的发现，都值得被记录下来，分享给同样好奇的你。

# 把冷冰冰的 KPI 数据，改成老李的“趣味生活数据”
metrics:
  headline: 趣味数据
  title: "一些无用的，但有趣的数字"
  description: 生活不是 KPI，但这些数字记录了我认真生活的痕迹。
  items:
    - value: "50+"
      label: 去过的城市
      class: "text-primary"
    - value: "∞"
      label: 喝过的咖啡
      class: "text-success"
    - value: "100%"
      label: 对生活的好奇心
      class: "text-info"
    - value: "24/7"
      label: 保持热爱
      class: "text-warning"

cta:
  title: "想和老李\n交个朋友？"
  description: 无论是分享好玩的东西，还是聊聊生活中的小确幸，都欢迎随时找我。
  command: echo "Hello, Laoli!"
  links:
    - label: 发送邮件
      color: primary
      to: 'mailto:x@zaeth.com' 
    - label: 关注我的动态
      color: neutral
      variant: soft
      to: 'https://sai.st'